<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body id="page-top">
    <div id="wrapper">
        <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="index.html">
                <div class="sidebar-brand-icon"><i class="fas fa-boxes"></i></div>
                <div class="sidebar-brand-text mx-3">Peminjaman</div>
            </a>
            <hr class="sidebar-divider my-0">
            <li class="nav-item">
                <a class="nav-link" href="index.html"><i
                        class="fas fa-fw fa-tachometer-alt"></i><span>Dashboard</span></a>
            </li>
            <hr class="sidebar-divider">
            <div class="sidebar-heading">Master Data</div>
            <li class="nav-item">
                <a class="nav-link" href="aset.html"><i class="fas fa-fw fa-box"></i><span>Master Asset</span></a>
            </li>
            <li class="nav-item active">
                <a class="nav-link" href="mahasiswa.html"><i class="fas fa-fw fa-users"></i><span>Master
                        Mahasiswa</span></a>
            </li>
            <hr class="sidebar-divider">
            <div class="sidebar-heading">Transaksi</div>
            <li class="nav-item">
                <a class="nav-link" href="peminjaman.html"><i
                        class="fas fa-fw fa-handshake"></i><span>Peminjaman</span></a>
            </li>
        </ul>
        <!-- End of Sidebar -->

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow"></nav>
                <div class="container-fluid">
                    <h1 class="h3 mb-2 text-gray-800">Master Data Mahasiswa</h1>
                    <div class="card shadow mb-4">
                        <div class="card-header py-3 d-flex justify-content-between align-items-center">
                            <h6 class="m-0 font-weight-bold text-primary">Daftar Mahasiswa</h6>
                            <button class="btn btn-primary btn-sm" data-toggle="modal" data-target="#modalMahasiswa">
                                <i class="fas fa-plus"></i> Tambah Mahasiswa
                            </button>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>NIM</th>
                                            <th>Nama Lengkap</th>
                                            <th>Program Studi</th>
                                            <th>Angkatan</th>
                                            <th>Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody id="mahasiswaTableBody">
                                        <tr>
                                            <td colspan="5" class="text-center">Memuat data mahasiswa...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Mahasiswa -->
    <div class="modal fade" id="modalMahasiswa" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Form Tambah Mahasiswa</h5>
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <form id="formMahasiswa">
                    <div class="modal-body">
                        <!-- Input hidden untuk ID Mahasiswa (Update) -->
                        <input type="hidden" id="mahasiswa_id">

                        <div class="form-group"><label>NIM</label><input type="text" class="form-control" id="nim"
                                required></div>
                        <div class="form-group"><label>Nama Lengkap</label><input type="text" class="form-control"
                                id="nama" required></div>
                        <div class="form-group"><label>Jurusan</label><input type="text" class="form-control"
                                id="jurusan" required></div>
                        <div class="form-group"><label>Angkatan</label><input type="number" class="form-control"
                                id="angkatan" required></div>
                        <div class="form-group"><label>Email</label><input type="email" class="form-control" id="email"
                                required></div>
                        <div class="form-group"><label>Telepon</label><input type="text" class="form-control"
                                id="telepon" required></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/sb-admin-2.min.js"></script>

    <script>
        let globalMahasiswa = []; // Simpan global untuk fitur Edit

        async function loadMahasiswa() {
            const tbody = document.getElementById('mahasiswaTableBody');
            try {
                let response = await fetch('https://api.melangkah.my.id/mahasiswa/read.php');
                let data = await response.json();
                tbody.innerHTML = '';

                globalMahasiswa = data.data || data;

                globalMahasiswa.forEach(mhs => {
                    tbody.innerHTML += `
                    <tr>
                        <td>${mhs.nim}</td>
                        <td>${mhs.nama}</td>
                        <td>${mhs.jurusan}</td>
                        <td>${mhs.angkatan}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="editMahasiswa(${mhs.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="hapusMahasiswa(${mhs.id})">
                                <i class="fas fa-trash"></i> Hapus
                            </button>
                        </td>
                    </tr>
                    `;
                });
            } catch (error) {
                console.error('Gagal memuat data:', error);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Gagal memuat data mahasiswa.</td></tr>`;
            }
        }

        function editMahasiswa(id) {
            let mhs = globalMahasiswa.find(m => m.id == id);
            if (mhs) {
                document.getElementById('mahasiswa_id').value = mhs.id;
                document.getElementById('nim').value = mhs.nim;
                document.getElementById('nama').value = mhs.nama;
                document.getElementById('jurusan').value = mhs.jurusan;
                document.getElementById('angkatan').value = mhs.angkatan;
                if (mhs.email) document.getElementById('email').value = mhs.email;
                if (mhs.telepon) document.getElementById('telepon').value = mhs.telepon;

                document.querySelector('#modalMahasiswa .modal-title').innerText = 'Edit Data Mahasiswa';
                $('#modalMahasiswa').modal('show');
            }
        }

        // Reset form setiap kali modal ditutup
        $('#modalMahasiswa').on('hidden.bs.modal', function () {
            document.getElementById('formMahasiswa').reset();
            document.getElementById('mahasiswa_id').value = '';
            document.querySelector('#modalMahasiswa .modal-title').innerText = 'Form Tambah Mahasiswa';
        });

        document.getElementById('formMahasiswa').addEventListener('submit', async function (e) {
            e.preventDefault();

            let id = document.getElementById('mahasiswa_id').value;
            let payload = {
                nim: document.getElementById('nim').value,
                nama: document.getElementById('nama').value,
                jurusan: document.getElementById('jurusan').value,
                angkatan: parseInt(document.getElementById('angkatan').value),
                email: document.getElementById('email').value,
                telepon: document.getElementById('telepon').value
            };

            if (id) payload.id = id;

            let url = id ? 'https://api.melangkah.my.id/mahasiswa/update.php' : 'https://api.melangkah.my.id/mahasiswa/create.php';
            let method = id ? 'PUT' : 'POST';

            try {
                await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                $('#modalMahasiswa').modal('hide');
                this.reset();
                loadMahasiswa();
            } catch (error) { console.error('Gagal menyimpan:', error); }
        });

        async function hapusMahasiswa(id) {
            if (confirm('Yakin ingin menghapus mahasiswa ini?')) {
                try {
                    await fetch('https://api.melangkah.my.id/mahasiswa/delete.php?id=' + id, { method: 'DELETE' });
                    loadMahasiswa();
                } catch (error) { console.error('Gagal menghapus:', error); }
            }
        }

        document.addEventListener('DOMContentLoaded', loadMahasiswa);
    </script>
</body>

</html>
